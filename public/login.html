<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Monatsbudget</title>
<meta name="theme-color" content="#F2F2F0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0A0A0B" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Monatsbudget">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icons/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon.ico" sizes="32x32">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
:root{
  color-scheme:light;
  --bg:#F2F2F0; --surface:#FFFFFF; --fill:#EAEAE6; --fill-2:#DDDDD8;
  --text:#0B0B0C; --text-2:#6B6B70; --text-3:#A5A5A9;
  --hero:#111112; --hero-text:#F4F4F1;
  --ink:#0B0B0C; --on-ink:#FFFFFF;
  --danger:#B8433A; --danger-soft:rgba(184,67,58,.10);
  --shadow:0 1px 1px rgba(11,11,12,.03),0 6px 20px rgba(11,11,12,.05);
  --r-card:22px;
  --f:-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --fd:-apple-system,BlinkMacSystemFont,"SF Pro Display","Inter","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --ease:cubic-bezier(.22,1,.36,1);
  --spring:cubic-bezier(.34,1.3,.64,1);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0A0A0B; --surface:#151517; --fill:#232326; --fill-2:#2E2E32;
    --text:#F4F4F1; --text-2:#9A9AA0; --text-3:#5F5F65;
    --hero:#ECECE8; --hero-text:#0B0B0C;
    --ink:#F4F4F1; --on-ink:#0B0B0C;
    --danger:#E06A60; --danger-soft:rgba(224,106,96,.14);
    --shadow:0 0 0 1px rgba(255,255,255,.04);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0A0A0B; --surface:#151517; --fill:#232326; --fill-2:#2E2E32;
  --text:#F4F4F1; --text-2:#9A9AA0; --text-3:#5F5F65;
  --hero:#ECECE8; --hero-text:#0B0B0C;
  --ink:#F4F4F1; --on-ink:#0B0B0C;
  --danger:#E06A60; --danger-soft:rgba(224,106,96,.14);
  --shadow:0 0 0 1px rgba(255,255,255,.04);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--f);font-size:17px;line-height:1.3;
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;-webkit-text-size-adjust:100%;text-size-adjust:100%}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;touch-action:manipulation}
input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--text);outline-offset:2px;border-radius:10px}
[hidden]{display:none!important}
*{scrollbar-width:none}
*::-webkit-scrollbar{display:none}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}

.wrap{min-height:100vh;min-height:100dvh;width:min(100%,420px);margin:0 auto;display:flex;flex-direction:column;justify-content:center;gap:22px;
  padding:calc(env(safe-area-inset-top,0px) + 28px) 16px calc(env(safe-area-inset-bottom,0px) + 28px)}
.brand{display:flex;flex-direction:column;gap:14px;padding:0 4px;animation:intro .6s var(--ease) both}
.logo{width:58px;height:58px;border-radius:17px;background:var(--hero);color:var(--hero-text);display:grid;place-items:center;box-shadow:0 10px 30px rgba(11,11,12,.16)}
.logo svg.i{width:30px;height:30px;stroke-width:1.8}
h1{margin:0;font-family:var(--fd);font-size:34px;font-weight:700;letter-spacing:-.025em;line-height:1.08}
.sub{margin:0;font-size:16px;color:var(--text-2);line-height:1.4;text-wrap:pretty}
.card{background:var(--surface);border-radius:var(--r-card);box-shadow:var(--shadow);padding:16px;display:flex;flex-direction:column;gap:10px;
  animation:intro .6s var(--ease) .06s both}
.card.shake{animation:shake .38s var(--ease)}
.field{display:flex;align-items:center;gap:10px;background:var(--fill);border-radius:14px;padding:0 14px;height:52px}
.field svg.i{color:var(--text-3);width:19px;height:19px}
.field input{flex:1;min-width:0;border:0;outline:0;background:none;font-size:17px;height:100%}
.field input::placeholder{color:var(--text-3)}
.field:focus-within{box-shadow:inset 0 0 0 1.5px var(--text-3)}
.err{font-size:14px;color:var(--danger);background:var(--danger-soft);border-radius:12px;padding:10px 12px;line-height:1.4}
.err:empty{display:none}
.btn-primary{height:54px;border-radius:17px;background:var(--ink);color:var(--on-ink);font-size:17px;font-weight:600;letter-spacing:-.01em;margin-top:4px;
  transition:transform .3s var(--spring),opacity .25s}
.btn-primary:active{transform:scale(.97)}
.btn-primary:disabled{opacity:.4}
.switch-mode{text-align:center;font-size:15px;color:var(--text-2);animation:intro .6s var(--ease) .12s both}
.txt-btn{color:var(--text);font-weight:600;padding:8px 4px;transition:opacity .2s}
.txt-btn:active{opacity:.5}
.note{text-align:center;font-size:12px;color:var(--text-3);line-height:1.5;padding:0 20px}
@keyframes intro{from{opacity:.35;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes shake{20%{transform:translateX(-7px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(2px)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="i-wallet" viewBox="0 0 24 24"><path d="M4 8a2.5 2.5 0 0 1 2.5-2.5H17a1.5 1.5 0 0 1 1.5 1.5v1"/><rect x="4" y="8" width="16.5" height="11.5" rx="2.5"/><path d="M15.5 13.75h1.5"/></symbol>
    <symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8.5" r="3.8"/><path d="M4.5 20a7.5 7.5 0 0 1 15 0"/></symbol>
    <symbol id="i-lock" viewBox="0 0 24 24"><rect x="5" y="10.5" width="14" height="10" rx="2.5"/><path d="M8 10.5V8a4 4 0 0 1 8 0v2.5"/></symbol>
  </defs>
</svg>
<main class="wrap">
  <div class="brand">
    <div class="logo" aria-hidden="true"><svg class="i"><use href="#i-wallet"/></svg></div>
    <div>
      <h1 id="title">Monatsbudget</h1>
      <p class="sub" id="sub">Melde dich an, um dein Budget zu sehen.</p>
    </div>
  </div>
  <form class="card" id="form" novalidate>
    <label class="field"><svg class="i"><use href="#i-user"/></svg>
      <input id="user" name="username" type="text" placeholder="Benutzername" autocomplete="username" autocapitalize="none" spellcheck="false" maxlength="32" required aria-label="Benutzername"></label>
    <label class="field"><svg class="i"><use href="#i-lock"/></svg>
      <input id="pw" name="password" type="password" placeholder="Passwort" autocomplete="current-password" required aria-label="Passwort"></label>
    <label class="field" id="pw2Row" hidden><svg class="i"><use href="#i-lock"/></svg>
      <input id="pw2" name="password2" type="password" placeholder="Passwort wiederholen" autocomplete="new-password" aria-label="Passwort wiederholen"></label>
    <div class="err" id="err" role="alert"></div>
    <button class="btn-primary" id="submit" type="submit">Anmelden</button>
  </form>
  <div class="switch-mode" id="switchRow" hidden><span id="switchTxt"></span> <button class="txt-btn" id="switchBtn" type="button"></button></div>
  <p class="note" id="note">Deine Daten liegen in der Datenbank auf deinem Server.</p>
</main>
<script>
(() => {
'use strict';
const $ = s => document.querySelector(s);
const form = $('#form'), user = $('#user'), pw = $('#pw'), pw2 = $('#pw2'), err = $('#err'), submit = $('#submit');
let mode = 'login', registration = false;

const TEXT = {
  login: { title: 'Monatsbudget', sub: 'Melde dich an, um dein Budget zu sehen.', btn: 'Anmelden', url: '/api/auth/login' },
  register: { title: 'Konto erstellen', sub: 'Wähle einen Benutzernamen und ein Passwort mit mindestens 8 Zeichen.', btn: 'Konto erstellen', url: '/api/auth/register' },
  setup: { title: 'Willkommen', sub: 'Lege das erste Konto an. Es verwaltet später auch weitere Benutzer.', btn: 'Konto erstellen', url: '/api/auth/setup' },
};

async function call(method, url, body) {
  let res;
  try {
    res = await fetch(url, {
      method, cache: 'no-store', credentials: 'same-origin',
      headers: { 'X-Requested-With': 'monatsbudget', ...(body ? { 'Content-Type': 'application/json' } : {}) },
      body: body ? JSON.stringify(body) : undefined,
    });
  } catch (e) { throw new Error('Der Server ist nicht erreichbar.'); }
  const data = await res.json().catch(() => null);
  if (!res.ok) throw new Error((data && data.error) || 'Unbekannter Fehler.');
  return data;
}

function setMode(m) {
  mode = m;
  const t = TEXT[m], isNew = m !== 'login';
  $('#title').textContent = t.title;
  $('#sub').textContent = t.sub;
  submit.textContent = t.btn;
  $('#pw2Row').hidden = !isNew;
  pw.autocomplete = isNew ? 'new-password' : 'current-password';
  pw.placeholder = isNew ? 'Passwort (mind. 8 Zeichen)' : 'Passwort';
  $('#switchRow').hidden = m === 'setup' || !registration;
  $('#switchTxt').textContent = m === 'login' ? 'Noch kein Konto?' : 'Schon registriert?';
  $('#switchBtn').textContent = m === 'login' ? 'Registrieren' : 'Anmelden';
  err.textContent = '';
}

function fail(msg) {
  err.textContent = msg;
  form.classList.remove('shake'); void form.offsetWidth; form.classList.add('shake');
  if (navigator.vibrate) try { navigator.vibrate(16); } catch (e) { /* egal */ }
}

form.addEventListener('submit', async e => {
  e.preventDefault();
  const username = user.value.trim(), password = pw.value;
  if (!username || !password) return fail('Bitte Benutzername und Passwort eingeben.');
  if (mode !== 'login') {
    if (password.length < 8) return fail('Das Passwort braucht mindestens 8 Zeichen.');
    if (password !== pw2.value) return fail('Die Passwörter stimmen nicht überein.');
  }
  submit.disabled = true;
  try {
    await call('POST', TEXT[mode].url, { username, password });
    location.replace('/');
  } catch (x) {
    fail(x.message);
    submit.disabled = false;
    if (mode === 'login') { pw.value = ''; pw.focus(); }
  }
});
$('#switchBtn').addEventListener('click', () => { setMode(mode === 'login' ? 'register' : 'login'); user.focus(); });

(async () => {
  try {
    const s = await call('GET', '/api/auth/status');
    if (s.user) { location.replace('/'); return; }
    registration = !!s.registration;
    setMode(s.setup ? 'setup' : 'login');
  } catch (x) { setMode('login'); err.textContent = x.message; }
  if (matchMedia('(pointer: fine)').matches) user.focus();
})();
})();
</script>
</body>
</html>
