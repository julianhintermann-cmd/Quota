name: Docker-Image

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Tests
        run: npm test

  build:
    needs: test
    runs-on: ubuntu-latest
    env:
      # Optional: Sind diese beiden Repository-Secrets gesetzt, wird zusätzlich nach Docker Hub gepusht
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Image-Namen (lowercase)
        run: |
          images="ghcr.io/${GITHUB_REPOSITORY,,}"
          if [ -n "$DOCKERHUB_USERNAME" ]; then
            images="$images"$'\n'"${DOCKERHUB_USERNAME,,}/monatsbudget"
          fi
          { echo "IMAGES<<EOF"; echo "$images"; echo "EOF"; } >> "$GITHUB_ENV"

      - name: QEMU einrichten (ARM-Builds)
        uses: docker/setup-qemu-action@v3

      - name: Buildx einrichten
        uses: docker/setup-buildx-action@v3

      - name: Image für den Test bauen (amd64)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: monatsbudget:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Container testen
        run: test/smoke.sh monatsbudget:test

      - name: Bei GHCR anmelden
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Bei Docker Hub anmelden
        if: github.event_name != 'pull_request' && env.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      - name: Tags und Labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGES }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
          labels: |
            org.opencontainers.image.title=Monatsbudget
            org.opencontainers.image.description=Monatsbudget – persönliche Budget-App mit Benutzerkonten und SQLite-Datenbank

      - name: Bauen und pushen (amd64, arm64, arm/v7)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
